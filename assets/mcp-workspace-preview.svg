<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 424" width="720" height="424" role="img" aria-label="An IDE AI assistant debugging a RAG hallucination by calling Orchid MCP tools">
<style>@keyframes s1{0%,21.4%{opacity:0}23.6%,100%{opacity:1}}
@keyframes s2{0%,42.8%{opacity:0}45%,100%{opacity:1}}
@keyframes s3{0%,64.2%{opacity:0}66.4%,100%{opacity:1}}
.s1{animation:s1 14s linear infinite}
.s2{animation:s2 14s linear infinite}
.s3{animation:s3 14s linear infinite}
@keyframes scrl{0%,42.8%{transform:translateY(0)}45.6%,64.2%{transform:translateY(-200px)}67%,100%{transform:translateY(-372px)}}
.scrl{animation:scrl 14s linear infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
.blink{animation:blink 1.6s ease-in-out infinite}</style>
<defs><clipPath id="mframe"><rect width="720" height="424" rx="12"/></clipPath><clipPath id="mbody"><rect y="44" width="720" height="380"/></clipPath></defs>
