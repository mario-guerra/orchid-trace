<text x="62" y="258" font-size="11" fill="#a1a1aa" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">  "session_id": "sess_rag_prod_09",</text>
<text x="62" y="274" font-size="11" fill="#a1a1aa" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">  "query": "Q3 revenue"</text>
<text x="62" y="290" font-size="11" fill="#a1a1aa" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">}</text>
