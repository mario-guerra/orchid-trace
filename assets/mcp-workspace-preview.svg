<text x="688" y="335" font-size="10" fill="#71717a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="end" xml:space="preserve">12ms</text>
<text x="90" y="361" font-size="10" fill="#a1a1aa" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">{</text>
<text x="90" y="376" font-size="10" fill="#a1a1aa" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">  "matches": [</text>
<text x="90" y="391" font-size="10" fill="#a1a1aa" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">    {</text>
<text x="90" y="406" font-size="10" fill="#a1a1aa" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">      "exchange_id": "exch_8f92a",</text>
<text x="90" y="421" font-size="10" fill="#a1a1aa" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">      "model": "gpt-5.4",</text>
<text x="90" y="436" font-size="10" fill="#a1a1aa" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">      "request_body": {</text>
<text x="90" y="451" font-size="10" fill="#a1a1aa" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">        "messages": [</text>
<text x="90" y="466" font-size="10" fill="#a1a1aa" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">          {"role": "system", "content": "Context: [Doc_Q2_Report: Q2 revenue was $4.2M...]"},</text>
<text x="90" y="481" font-size="10" fill="#a1a1aa" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">          {"role": "user", "content": "What was the Q3 revenue?"}</text>
<text x="90" y="496" font-size="10" fill="#a1a1aa" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">        ]</text>
<text x="90" y="511" font-size="10" fill="#a1a1aa" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">      },</text>
<text x="90" y="526" font-size="10" fill="#a1a1aa" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">      "response_body": {</text>
<text x="90" y="541" font-size="10" fill="#a1a1aa" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">        "content": "Based on the context provided, the Q3 revenue was $4.2M."</text>
<text x="90" y="556" font-size="10" fill="#a1a1aa" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">      }</text>
<text x="90" y="571" font-size="10" fill="#a1a1aa" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">    }</text>
<text x="90" y="586" font-size="10" fill="#a1a1aa" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">  ]</text>
<text x="90" y="601" font-size="10" fill="#a1a1aa" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">}</text>
