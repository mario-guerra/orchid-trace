<text x="48" y="185" font-size="12" fill="#d4d4d8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xml:space="preserve">payload over the wire.</text>
<rect x="48" y="198" width="652" height="102" rx="8" fill="rgba(46,16,101,0.1)" stroke="rgba(76,29,149,0.3)"/>
<path d="M48 224 h652" stroke="rgba(76,29,149,0.2)"/>
<g stroke="#a78bfa" stroke-width="1.2" fill="none"><rect x="60" y="206" width="10" height="10" rx="2"/><rect x="63" y="209" width="4" height="4"/></g>
<text x="78" y="215" font-size="11" fill="#a78bfa" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">Calling Tool: mcp_orchid-proxy_search_exchanges</text>
<rect x="644" y="204" width="44" height="15" rx="3" fill="rgba(139,92,246,0.1)"/>
<text x="666" y="215" font-size="10" fill="#a78bfa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle" xml:space="preserve">Active</text>
