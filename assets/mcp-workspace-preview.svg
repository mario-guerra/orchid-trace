<g class="s3">
<circle cx="30" cy="639" r="10" fill="rgba(46,16,101,0.4)" stroke="rgba(76,29,149,0.3)"/><text x="30" y="642.5" font-size="9" fill="#a78bfa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="middle" xml:space="preserve">AI</text>
<rect x="48" y="629" width="652" height="126" rx="8" fill="rgba(24,24,27,0.3)" stroke="#18181b"/><text x="60" y="652" font-size="12" fill="#d4d4d8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xml:space="preserve">I found the root cause! The LLM didn't hallucinate — your RAG pipeline retrieved</text><text x="60" y="670" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xml:space="preserve"><tspan fill="#d4d4d8">the wrong chunk. The vector search injected the </tspan><tspan fill="#a78bfa" font-weight="600">Q2 Revenue Report</tspan><tspan fill="#d4d4d8"> into the system</tspan></text><text x="60" y="688" font-size="12" fill="#d4d4d8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xml:space="preserve">prompt context instead of the Q3 document. The LLM simply regurgitated the $4.2M</text><text x="60" y="706" font-size="12" fill="#d4d4d8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xml:space="preserve">figure from Q2.</text><text x="60" y="724" font-size="12" fill="#d4d4d8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xml:space="preserve"></text><text x="60" y="742" font-size="12" fill="#d4d4d8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xml:space="preserve">You should check your vector DB distance metric or chunking strategy.</text>
<rect class="blink" x="60" y="765" width="7" height="13" fill="#a78bfa" opacity="0.8"/>
</g>
</g></g>
