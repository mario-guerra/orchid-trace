<g clip-path="url(#mbody)"><g class="scrl">
<circle cx="30" cy="74" r="10" fill="#27272a"/><text x="30" y="77.5" font-size="9" fill="#d4d4d8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="middle" xml:space="preserve">U</text>
<rect x="48" y="64" width="652" height="72" rx="8" fill="rgba(20,20,22,0.6)" stroke="rgba(24,24,27,0.8)"/><text x="60" y="87" font-size="12" fill="#d4d4d8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xml:space="preserve">My RAG app hallucinated the Q3 revenue numbers. Use Orchid to find the exchange</text><text x="60" y="105" font-size="12" fill="#d4d4d8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xml:space="preserve">where it answered the Q3 question and check what context the vector DB actually</text><text x="60" y="123" font-size="12" fill="#d4d4d8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xml:space="preserve">injected into the prompt.</text>
