#cloud-config
package_update: true
package_upgrade: true

packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - gnupg
  - lsb-release
  - nvme-cli

runcmd:
  # 1. Format and mount the external EBS volume (detects nvme or standard block device)
  - mkdir -p /data
  - |
    DISK_DEV=""
    if [ -b "/dev/nvme1n1" ]; then
      DISK_DEV="/dev/nvme1n1"
    elif [ -b "/dev/xvdf" ]; then
      DISK_DEV="/dev/xvdf"
    elif [ -b "/dev/sdf" ]; then
      DISK_DEV="/dev/sdf"
    fi
    
    if [ -n "$DISK_DEV" ]; then
      if ! blkid "$DISK_DEV"; then
        mkfs.ext4 -F "$DISK_DEV"
      fi
      UUID=$(blkid -o value -s UUID "$DISK_DEV")
      echo "UUID=$UUID /data ext4 defaults,nofail 0 2" >> /etc/fstab
      mount -a
    fi
  - chown -R 10001:10001 /data

  # 2. Install Docker
  - mkdir -p /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin

  # 3. Create Docker Compose configuration
  - mkdir -p /opt/orchid
  - |
    cat << 'EOF' > /opt/orchid/docker-compose.yml
    version: '3.9'
    services:
      proxy:
        image: orchid-proxy:latest
        container_name: orchid-proxy
        restart: always
        ports:
          - "4320:4320"
          - "4321:4321"
        environment:
          ORCHID_BIND_HOST: 0.0.0.0
          ORCHID_API_KEY: "${ORCHID_API_KEY}"
          ORCHID_DB_PATH: /data/orchid.db
        volumes:
          - /data:/data
    EOF

  # 4. Launch the proxy
  - cd /opt/orchid && docker compose up -d
