[package]
name = "orchid-sdk"
version = "0.1.1"
edition = "2021"
description = "Orchid Thin SDK for environment routing, transport patching, and proxy control"
authors = ["Orchid Team <team@orchid.dev>"]
license = "Apache-2.0"
repository = "https://github.com/mario-guerra/orchid"
keywords = ["llm", "proxy", "debugging", "observability"]
categories = ["development-tools::debugging", "api-bindings"]

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
reqwest-middleware = "0.5"
tokio = { version = "1.0", features = ["full"] }
http = "1.1"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"
async-trait = "0.1"

[dev-dependencies]
tokio-test = "0.4"
